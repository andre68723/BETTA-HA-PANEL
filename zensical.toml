[project.theme]
language = "en"
logo = "img/brand/BETTAOS.jpg"
features = ["navigation.tabs", "navigation.top", "navigation.footer", "content.code.copy", "search.highlight"]

[project.plugins.search]
enabled = true

# Bundle the supported worker shim so file:// search needs no CDN.
[project.plugins.offline]
enabled = true

[project.extra]
polyfills = [{ path = "javascripts/vendor/iframe-worker-shim.js", type = "text/javascript", async = false, defer = false }]

[[project.theme.palette]]
scheme = "default"
primary = "teal"
accent = "teal"
toggle.icon = "lucide/moon"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
primary = "teal"
accent = "teal"
toggle.icon = "lucide/sun"
toggle.name = "Switch to light mode"

# Working notes and capture metadata are not public documentation. Local plans
# and skills live outside docs/ in .local/. Zensical renders the Markdown galleries.
[project.plugins.exclude]
glob = ["**/sources.json", "**/manifest.json", "img/hardware/README.md"]
