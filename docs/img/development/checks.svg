<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 600" width="1240" height="600" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-label="Checks that run without a device"><rect width="1240" height="600" rx="20" fill="#ffffff"/><rect x="30" y="70" width="260" height="120" rx="16" fill="#e3f2fd" stroke="#1976d2" stroke-width="4"/><text x="160.0" y="104" text-anchor="middle" font-size="21" font-weight="700" fill="#1d3557">Web editor</text><text x="160.0" y="132" text-anchor="middle" font-size="17" fill="#1d3557">HTML, CSS, ordered JS</text><rect x="30" y="240" width="260" height="120" rx="16" fill="#e3f2fd" stroke="#1976d2" stroke-width="4"/><text x="160.0" y="274" text-anchor="middle" font-size="21" font-weight="700" fill="#1d3557">Firmware sources</text><text x="160.0" y="302" text-anchor="middle" font-size="17" fill="#1d3557">widgets, layout, themes</text><rect x="30" y="410" width="260" height="120" rx="16" fill="#e3f2fd" stroke="#1976d2" stroke-width="4"/><text x="160.0" y="444" text-anchor="middle" font-size="21" font-weight="700" fill="#1d3557">Fixtures</text><text x="160.0" y="472" text-anchor="middle" font-size="17" fill="#1d3557">layouts and HA states</text><text x="160.0" y="496" text-anchor="middle" font-size="17" fill="#1d3557">in tests/simulator</text><line x1="290" y1="130" x2="376" y2="300" stroke="#1d3557" stroke-width="5"/><polygon points="380,300 362,289 362,311" fill="#1d3557"/><line x1="290" y1="300" x2="376" y2="300" stroke="#1d3557" stroke-width="5"/><polygon points="380,300 362,289 362,311" fill="#1d3557"/><line x1="290" y1="470" x2="376" y2="300" stroke="#1d3557" stroke-width="5"/><polygon points="380,300 362,289 362,311" fill="#1d3557"/><rect x="380" y="20" width="440" height="560" rx="20" fill="#fff8e1" stroke="#f9a825" stroke-width="5"/><text x="600" y="58" text-anchor="middle" font-size="23" font-weight="700" fill="#1d3557">scripts/check.sh</text><rect x="410" y="78" width="380" height="72" rx="16" fill="#ffffff" stroke="#1976d2" stroke-width="4"/><text x="600.0" y="112" text-anchor="middle" font-size="21" font-weight="700" fill="#1d3557">Editor and tooling</text><text x="600.0" y="140" text-anchor="middle" font-size="17" fill="#1d3557">JS/Python tests, syntax, check_web.py</text><rect x="410" y="161" width="380" height="72" rx="16" fill="#ffffff" stroke="#1976d2" stroke-width="4"/><text x="600.0" y="195" text-anchor="middle" font-size="21" font-weight="700" fill="#1d3557">Host C tests</text><text x="600.0" y="223" text-anchor="middle" font-size="17" fill="#1d3557">pure logic, panel4 and paneljc</text><rect x="410" y="244" width="380" height="72" rx="16" fill="#ffffff" stroke="#1976d2" stroke-width="4"/><text x="600.0" y="278" text-anchor="middle" font-size="21" font-weight="700" fill="#1d3557">Widget layout in the simulator</text><text x="600.0" y="306" text-anchor="middle" font-size="17" fill="#1d3557">3 variants; 3 text sizes with --full</text><rect x="410" y="327" width="380" height="72" rx="16" fill="#ffffff" stroke="#1976d2" stroke-width="4"/><text x="600.0" y="361" text-anchor="middle" font-size="21" font-weight="700" fill="#1d3557">Fonts, source and docs sizes</text><text x="600.0" y="389" text-anchor="middle" font-size="17" fill="#1d3557">file size ceilings, font subsets</text><rect x="410" y="410" width="380" height="72" rx="16" fill="#ffffff" stroke="#1976d2" stroke-width="4"/><text x="600.0" y="444" text-anchor="middle" font-size="21" font-weight="700" fill="#1d3557">Gallery freshness</text><text x="600.0" y="472" text-anchor="middle" font-size="17" fill="#1d3557">a hint, never a failure</text><rect x="410" y="493" width="380" height="72" rx="16" fill="#ffffff" stroke="#1976d2" stroke-width="4"/><text x="600.0" y="527" text-anchor="middle" font-size="21" font-weight="700" fill="#1d3557">Passing steps</text><text x="600.0" y="555" text-anchor="middle" font-size="17" fill="#1d3557">cached by inputs and tool versions</text><rect x="900" y="70" width="310" height="130" rx="16" fill="#e3f2fd" stroke="#1976d2" stroke-width="4"/><text x="1055.0" y="104" text-anchor="middle" font-size="21" font-weight="700" fill="#1d3557">Firmware builds</text><text x="1055.0" y="132" text-anchor="middle" font-size="17" fill="#1d3557">check.sh --build:</text><text x="1055.0" y="156" text-anchor="middle" font-size="17" fill="#1d3557">all five variants</text><text x="1055.0" y="180" text-anchor="middle" font-size="17" fill="#1d3557">(explicit, not in CI checks)</text><rect x="900" y="250" width="310" height="110" rx="16" fill="#ffffff" stroke="#1976d2" stroke-width="4"/><text x="1055.0" y="284" text-anchor="middle" font-size="21" font-weight="700" fill="#1d3557">CI on GitHub</text><text x="1055.0" y="312" text-anchor="middle" font-size="17" fill="#1d3557">check.yml runs check.sh --full</text><text x="1055.0" y="336" text-anchor="middle" font-size="17" fill="#1d3557">without the builds</text><rect x="900" y="410" width="310" height="130" rx="16" fill="#ffffff" stroke="#1976d2" stroke-width="4" stroke-dasharray="14 9"/><text x="1055.0" y="444" text-anchor="middle" font-size="21" font-weight="700" fill="#1d3557">Real device</text><text x="1055.0" y="472" text-anchor="middle" font-size="17" fill="#1d3557">screenshots, page captures,</text><text x="1055.0" y="496" text-anchor="middle" font-size="17" fill="#1d3557">stress test: only when asked</text><line x1="820" y1="135" x2="896" y2="135" stroke="#1d3557" stroke-width="5"/><polygon points="900,135 882,124 882,146" fill="#1d3557"/><line x1="820" y1="305" x2="896" y2="305" stroke="#1d3557" stroke-width="5"/><polygon points="900,305 882,294 882,316" fill="#1d3557"/><line x1="820" y1="475" x2="896" y2="475" stroke="#1d3557" stroke-width="5" stroke-dasharray="14 9"/><polygon points="900,475 882,464 882,486" fill="#1d3557"/></svg>
