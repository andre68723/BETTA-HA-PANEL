# Manifest for the 10.1" 1280x800 panel variant (Waveshare ESP32-P4 Nano).
# Selected automatically by the top-level CMakeLists.txt based on the active
# SDKCONFIG_DEFAULTS overlay. Do NOT edit main/idf_component.yml directly --
# it is regenerated from this file on every configure.
dependencies:
  # lvgl, esp_lcd_touch, littlefs, esp_websocket_client, mqtt and cjson are pinned to an exact
  # version (not a range or "*") across every variant's manifest. They used to resolve independently
  # per variant, and an unconstrained package can resolve to a different version purely because of
  # *when* each variant's dependencies.lock was last regenerated, not any real incompatibility.
  # Pinning keeps every variant on the same, already-tested version regardless of which one is built
  # next; bump all three manifests together, deliberately.
  idf: ">=5.5"
  espressif/esp_wifi_remote:
    version: "1.6.5"
    rules:
      - if: "target in [esp32p4]"
  espressif/esp_lvgl_adapter:
    version: "0.7.3"
  lvgl/lvgl:
    version: "9.6.0~1"
  waveshare/esp32_p4_nano:
    version: "^1.2.0"
    rules:
      - if: "target in [esp32p4]"
  espressif/esp_lcd_touch:
    version: "1.2.1"
    rules:
      - if: "target in [esp32p4]"
  joltwallet/littlefs:
    version: "1.23.0"
  espressif/esp_hosted:
    version: "3.0.10"
    rules:
      - if: "target in [esp32p4]"
  espressif/esp_websocket_client:
    version: "1.8.0"
  espressif/mqtt:
    version: "1.1.0"
  # ESP-IDF 6.0 removed the built-in "json" (cJSON) component; it now must be
  # pulled in explicitly as a managed component (registered name: "cjson").
  # See main/CMakeLists.txt's IDF_VERSION_MAJOR-gated JSON_COMPONENT_NAME.
  espressif/cjson:
    version: "1.7.19~2"
    rules:
      - if: "idf_version >=6.0"
  # ESP-IDF 6.0 removed the built-in "usb" component (used transitively by
  # the waveshare/esp32_p4_nano BSP); pull in the managed replacement
  # explicitly so that transitive requirement resolves.
  espressif/usb:
    version: "*"
    rules:
      - if: "idf_version >=6.0"
