# Manifest for the M5Stack Tab5 variant (ESP32-P4 + C6, one ST7121 unit exercised locally).
# Selected automatically by the top-level CMakeLists.txt based on the active
# SDKCONFIG_DEFAULTS overlay. Do NOT edit main/idf_component.yml directly --
# it is regenerated from this file on every configure.
dependencies:
  # Same pins as the other manifests (see idf_component.panel4.yml for why they are exact).
  idf: ">=5.5"
  espressif/esp_wifi_remote:
    version: "1.6.5"
    rules:
      - if: "target in [esp32p4]"
  espressif/esp_lvgl_adapter:
    version: "0.7.3"
  lvgl/lvgl:
    version: "9.6.0~1"
  # Espressif's board support package: picks the ILI9881C or the ST7123/ST7121 display and the matching touch
  # controller of the unit, drives backlight PWM on GPIO22 and reset/Wi-Fi enable over the I/O expanders. It asks
  # for esp_codec_dev ~1.5, esp_video ~2.0 and esp_lvgl_port ^2.
  espressif/m5stack_tab5:
    version: "1.3.2"
    rules:
      - if: "target in [esp32p4]"
  espressif/esp_lcd_touch:
    version: "1.2.1"
    rules:
      - if: "target in [esp32p4]"
  joltwallet/littlefs:
    version: "1.23.0"
  espressif/esp_hosted:
    version: "2.12.13"
    rules:
      - if: "target in [esp32p4]"
  espressif/esp_websocket_client:
    version: "1.8.0"
  espressif/mqtt:
    version: "1.1.0"
  espressif/cjson:
    version: "1.7.19~2"
    rules:
      - if: "idf_version >=6.0"
  espressif/usb:
    version: "*"
    rules:
      - if: "idf_version >=6.0"
