# Manifest for the Guition JC8012P4A1 variant (ESP32-P4 + JD9365 MIPI-DSI).
# Selected automatically by the top-level CMakeLists.txt based on the active
# SDKCONFIG_DEFAULTS overlay. Do NOT edit main/idf_component.yml directly --
# it is regenerated from this file on every configure.
#
# Touch driver (GSL3680 / Silead) is vendored in main/drivers/gsl3680/ because
# no published ESP component exists for this controller; it is added directly
# to idf_component_register(SRCS ...) in main/CMakeLists.txt.
dependencies:
  # lvgl, esp_lcd_touch, littlefs, esp_websocket_client, mqtt and cjson are pinned to an exact
  # version (not a range or "*") across every variant's manifest. They used to resolve independently
  # per variant, and an unconstrained package can resolve to a different version purely because of
  # *when* each variant's dependencies.lock was last regenerated, not any real incompatibility.
  # Pinning keeps every variant on the same, already-tested version regardless of which one is built
  # next; bump all three manifests together, deliberately.
  idf: ">=5.5"
  espressif/esp_wifi_remote:
    version: "1.6.5"
    rules:
      - if: "target in [esp32p4]"
  # paneljc has no Waveshare BSP, which caps the codec at ~1.5 for panel4/panel10; this pin is its own.
  espressif/esp_codec_dev:
    version: "1.6.2"
  espressif/esp_lvgl_adapter:
    version: "0.7.3"
  lvgl/lvgl:
    version: "9.6.0~1"
  espressif/esp_lcd_jd9365:
    version: "^2.0.0"
  espressif/esp_lcd_touch:
    version: "1.2.1"
  joltwallet/littlefs:
    version: "1.23.0"
  espressif/esp_hosted:
    version: "3.0.10"
    rules:
      - if: "target in [esp32p4]"
  espressif/esp_websocket_client:
    version: "1.8.0"
  espressif/mqtt:
    version: "1.1.0"
  # ESP-IDF 6.0 removed the built-in "json" (cJSON) component; it now must be
  # pulled in explicitly as a managed component (registered name: "cjson").
  # See main/CMakeLists.txt's IDF_VERSION_MAJOR-gated JSON_COMPONENT_NAME.
  espressif/cjson:
    version: "1.7.19~2"
    rules:
      - if: "idf_version >=6.0"
  # Built-in OV02C10 MIPI-CSI camera, used only as an ambient light / presence
  # sensor (main/drivers/ambient_camera.c). No streaming, no JPEG.
  # 2.3.0 is the newest that works on the P4 v1.x silicon of these boards: esp_ipa 2.3+ (and with it esp_video 2.4+) ships a prebuilt
  # library with RISC-V Zba/Zbb instructions (sh2add ...) that v1.x does not execute (illegal instruction in create_ipa_array, 2026-10-02).
  espressif/esp_video:
    version: "2.3.0"
    rules:
      - if: "target in [esp32p4]"
