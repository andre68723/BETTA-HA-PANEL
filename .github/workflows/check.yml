#
# Only the fast checks run here. The firmware builds need ESP-IDF 6.1 and run in build.yml.
name: check
on:
  push:
  pull_request:
permissions:
  contents: read

# Only PR checks share a key; pushes have a unique run key and are never canceled.
concurrency:
  group: checks-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fast:
    name: fast (${{ matrix.group }})
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    env:
      CHECK_GROUP: ${{ matrix.group }}
    strategy:
      fail-fast: false
      matrix:
        # The groups of scripts/check.sh run as parallel jobs: the simulator regressions and the layout at all three text
        # steps of one variant each, then the host tests and the web checks.
        group: [web, host, sim-panel4, sim-paneljc, sim-tab5]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7
        with:
          node-version: 24
      # A stalled package mirror once held this step for 18 minutes and another time for 3 minutes on one download:
      # bound each connection, restart a stalled install (downloaded packages are kept) and cap the step.
      - name: Install system packages
        timeout-minutes: 14
        run: |
          apt_opts="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          sudo apt-get $apt_opts update
          for attempt in 1 2 3; do
            sudo timeout 240 apt-get $apt_opts install -y libcjson-dev pkg-config cmake libsdl2-dev python3-pil && exit 0
            echo "apt-get install attempt $attempt failed or stalled"
          done
          exit 1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: '0.13.7'
          python-version: '3.13'
          enable-cache: false
      - run: uv run --locked --only-group checks scripts/check.sh --group "$CHECK_GROUP"
