#
# Builds the firmware for every variant with ESP-IDF 6.1 and packages the images the way
# scripts/package_release.sh does for a release; the images are workflow artifacts. After a push to main the
# `release` job publishes them as the GitHub release named by BETTAOS_RELEASE_VERSION in CMakeLists.txt: it creates the
# tag on that commit, marks a version with a suffix (v0.9.2-rc1) as a pre-release and does nothing when the release
# already exists, so a merge without a version change publishes nothing. On any other ref (or with dry_run) the job
# stops before creating anything and prints what it would publish.
name: build
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Check the release step on this ref without creating a release (always on for other refs than main)
        type: boolean
        default: false
permissions:
  contents: read

jobs:
  firmware:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    container: espressif/idf:v6.1@sha256:81893c71bb5e570088901f21def8684c25cd2a9020281bd01b843a7655edb18c
    env:
      VARIANT: ${{ matrix.variant }}
    strategy:
      fail-fast: false
      matrix:
        variant: [panel4, panel10, paneljc, paneljc-v2, tab5]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - name: ESP-Hosted C6 firmware
        run: |
          curl -L --fail https://github.com/esphome/esp-hosted-firmware/releases/download/v3.1.0/network_adapter_esp32c6.bin \
            -o release/network_adapter_esp32c6_3.1.0.bin
          echo "ea8d6ac5bacdf69a70ade4f466918ac996a6af5cad244d481d3ed4ebfb5a0079  release/network_adapter_esp32c6_3.1.0.bin" | sha256sum -c -
      - name: Build
        run: |
          . "$IDF_PATH/export.sh"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          # The first configure fetches the managed components and patches them afterwards (tools/apply_component_patches.py),
          # too late for that run's component requirements. A second configure sees the patched files.
          scripts/build.sh "$VARIANT" reconfigure
          scripts/build.sh "$VARIANT" reconfigure build
      - name: Package
        run: |
          . "$IDF_PATH/export.sh"
          version=$(sed -n 's/^set(BETTAOS_RELEASE_VERSION "\(.*\)")$/\1/p' CMakeLists.txt)
          scripts/package_release.sh "$version" "$VARIANT"
          mkdir -p dist && cp release/out/"$version"/*.bin dist/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: images-${{ matrix.variant }}
          path: dist/*.bin
          if-no-files-found: error
  checksums:
    needs: firmware
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8
        with:
          pattern: images-*
          merge-multiple: true
          path: dist
      - run: cd dist && sha256sum *.bin | tee SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: release-images
          path: dist/
  release:
    needs: checksums
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      DRY_RUN: ${{ github.ref != 'refs/heads/main' || inputs.dry_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8
        with:
          name: release-images
          path: dist
      - name: Publish the release
        run: |
          version=$(sed -n 's/^set(BETTAOS_RELEASE_VERSION "\(.*\)")$/\1/p' CMakeLists.txt)
          [ -n "$version" ] || { echo "no BETTAOS_RELEASE_VERSION in CMakeLists.txt"; exit 1; }
          echo "Version $version, commit $GITHUB_SHA"
          ls -l dist
          (cd dist && sha256sum -c SHA256SUMS)
          if gh release view "$version" >/dev/null 2>&1; then
            echo "Release $version already exists: nothing to publish. Raise BETTAOS_RELEASE_VERSION for the next release."
            exit 0
          fi
          if tag_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$version" --jq .object.sha 2>/dev/null) && [ "$tag_sha" != "$GITHUB_SHA" ]; then
            echo "Tag $version exists on $tag_sha, not on this commit: refusing to publish."
            exit 1
          fi
          flag=""
          case "$version" in *-*) flag="--prerelease" ;; esac
          scripts/release_body.sh "$version" "${GITHUB_SHA::7}" > notes.md
          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run, would publish $version ($flag) from $GITHUB_SHA with:"
            ls dist/*.bin dist/SHA256SUMS
            cat notes.md
            exit 0
          fi
          gh release create "$version" --target "$GITHUB_SHA" --title "BETTA HA Panel $version" \
            --notes-file notes.md --generate-notes $flag dist/*.bin dist/SHA256SUMS
