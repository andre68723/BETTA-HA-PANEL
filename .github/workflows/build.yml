#
# Builds the firmware for every variant with ESP-IDF 6.1 and packages the images the way
# tools/package_release.sh does for a release. It publishes nothing: the images are workflow
# artifacts. Triggered by a pushed version tag, a push to main or by hand.
name: build
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read

jobs:
  firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container: espressif/idf:v6.1@sha256:81893c71bb5e570088901f21def8684c25cd2a9020281bd01b843a7655edb18c
    env:
      VARIANT: ${{ matrix.variant }}
    strategy:
      fail-fast: false
      matrix:
        variant: [panel4, panel10, paneljc, paneljc-v2, tab5]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - name: ESP-Hosted C6 firmware
        run: |
          curl -L --fail https://github.com/esphome/esp-hosted-firmware/releases/download/v2.12.13/network_adapter_esp32c6.bin \
            -o release/network_adapter_esp32c6_2.12.13.bin
          echo "09e4ed4ff648444ad045c1d934825af407648f58898586ce9f4275e53fdb23f6  release/network_adapter_esp32c6_2.12.13.bin" | sha256sum -c -
      - name: Build
        run: |
          . "$IDF_PATH/export.sh"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          # The first configure fetches the managed components and patches them afterwards (tools/apply_component_patches.py),
          # too late for that run's component requirements. A second configure sees the patched files.
          tools/build.sh "$VARIANT" reconfigure
          tools/build.sh "$VARIANT" reconfigure build
      - name: Package
        run: |
          . "$IDF_PATH/export.sh"
          version=$(sed -n 's/^set(BETTAOS_RELEASE_VERSION "\(.*\)")$/\1/p' CMakeLists.txt)
          tools/package_release.sh "$version" "$VARIANT"
          mkdir -p dist && cp release/out/"$version"/*.bin dist/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: images-${{ matrix.variant }}
          path: dist/*.bin
          if-no-files-found: error
  checksums:
    needs: firmware
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          pattern: images-*
          merge-multiple: true
          path: dist
      - run: cd dist && sha256sum *.bin | tee SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: release-images
          path: dist/
