#
# Builds the firmware for every variant with ESP-IDF 6.1 and packages the images the way
# scripts/package_release.sh does for a release. It publishes nothing: the images are workflow
# artifacts. Triggered by a pushed version tag, a push to main or by hand.
name: build
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read

jobs:
  firmware:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    container: espressif/idf:v6.1@sha256:81893c71bb5e570088901f21def8684c25cd2a9020281bd01b843a7655edb18c
    env:
      VARIANT: ${{ matrix.variant }}
    strategy:
      fail-fast: false
      matrix:
        variant: [panel4, panel10, paneljc, paneljc-v2, tab5]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - name: ESP-Hosted C6 firmware
        run: |
          curl -L --fail https://github.com/esphome/esp-hosted-firmware/releases/download/v3.0.10/network_adapter_esp32c6.bin \
            -o release/network_adapter_esp32c6_3.0.10.bin
          echo "c552957fad9f35cf31b0273099dd3b23dc5c388bb43884c6567756ab97fd8cce  release/network_adapter_esp32c6_3.0.10.bin" | sha256sum -c -
      - name: Build
        run: |
          . "$IDF_PATH/export.sh"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          # The first configure fetches the managed components and patches them afterwards (tools/apply_component_patches.py),
          # too late for that run's component requirements. A second configure sees the patched files.
          scripts/build.sh "$VARIANT" reconfigure
          scripts/build.sh "$VARIANT" reconfigure build
      - name: Package
        run: |
          . "$IDF_PATH/export.sh"
          version=$(sed -n 's/^set(BETTAOS_RELEASE_VERSION "\(.*\)")$/\1/p' CMakeLists.txt)
          scripts/package_release.sh "$version" "$VARIANT"
          mkdir -p dist && cp release/out/"$version"/*.bin dist/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: images-${{ matrix.variant }}
          path: dist/*.bin
          if-no-files-found: error
  checksums:
    needs: firmware
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8
        with:
          pattern: images-*
          merge-multiple: true
          path: dist
      - run: cd dist && sha256sum *.bin | tee SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: release-images
          path: dist/
